name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - name: Install Lua
        shell: bash
        run: |
          if ! command -v lua >/dev/null; then
            if [[ "$RUNNER_OS" == Linux ]]; then
              sudo apt-get update
              sudo apt-get install -y lua5.4
            else
              brew install lua
            fi
          fi
          command -v lua
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Test Unix installer
        run: sh tests/install_unix_test.sh

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test Windows installer
        shell: powershell
        run: ./tests/install_windows_test.ps1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - name: Test palette setup and updates on Windows
        run: go test ./tests -run 'Setup|Update|Version|Download'
